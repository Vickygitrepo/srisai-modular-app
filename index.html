<!DOCTYPE html>
<html lang="ta" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Sai Home Foods - Idiyappam Management Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', 'Noto Sans Tamil', sans-serif; }
    .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .hide-numbers .secret-number { filter: blur(6px); user-select: none; }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="max-w-7xl mx-auto px-4 py-4"></div>

  <script>
    // Firebase Credentials
    var firebaseConfig = {
      apiKey: "AIzaSyBE04f1-vwEbhkCxX-o_xU62aXTTok-AB4",
      authDomain: "sri-sai-home-foods-30fdb.firebaseapp.com",
      projectId: "sri-sai-home-foods-30fdb",
      storageBucket: "sri-sai-home-foods-30fdb.firebasestorage.app",
      messagingSenderId: "626791846753",
      appId: "1:626791846753:web:524fa5121115ef122f2b20"
    };

    var dbCloud = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        dbCloud = firebase.firestore();
      }
    } catch(e) {
      console.log("Firebase fallback mode.");
    }

    var STORAGE_KEY = 'srisai_production_v8';

    var initialData = {
      settings: {
        businessName: "Sri Sai Home Foods",
        ownerPhone: "9842100000",
        upiId: "srisaihomefoods@upi",
        hideConfidential: false,
        language: "en"
      },
      customers: [
        { id: 'c1', name: 'Hotel Annapoorna', type: 'hotel', ownerPhone: '9842100001', unitRate: 7, defaultMorningQty: 100, defaultEveningQty: 80, address: 'Main Road, Town Center', isActive: true },
        { id: 'c2', name: 'Hotel Saravana Bhavan', type: 'hotel', ownerPhone: '9842100002', unitRate: 6, defaultMorningQty: 150, defaultEveningQty: 120, address: 'Bus Stand Complex', isActive: true },
        { id: 'c3', name: 'Sangeetha Restaurant', type: 'restaurant', ownerPhone: '9842100003', unitRate: 6, defaultMorningQty: 80, defaultEveningQty: 60, address: 'Bypass Junction', isActive: true },
        { id: 'c4', name: 'Sri Ram Caterers', type: 'catering', ownerPhone: '9842100004', unitRate: 7, defaultMorningQty: 200, defaultEveningQty: 0, address: 'Gandhi Nagar', isActive: true }
      ],
      orders: [
        { id: 'o1', customerId: 'c1', date: '2026-10-12', shift: 'morning', pieces: 100, unitRateApplied: 7, amount: 700, deliveryStatus: 'delivered', rapidoCharge: 40 },
        { id: 'o2', customerId: 'c2', date: '2026-10-12', shift: 'morning', pieces: 150, unitRateApplied: 6, amount: 900, deliveryStatus: 'delivered', rapidoCharge: 50 },
        { id: 'o3', customerId: 'c1', date: '2026-10-13', shift: 'morning', pieces: 100, unitRateApplied: 7, amount: 700, deliveryStatus: 'delivered', rapidoCharge: 40 },
        { id: 'o4', customerId: 'c2', date: '2026-10-13', shift: 'morning', pieces: 150, unitRateApplied: 6, amount: 900, deliveryStatus: 'delivered', rapidoCharge: 50 },
        { id: 'o5', customerId: 'c3', date: '2026-10-13', shift: 'morning', pieces: 80, unitRateApplied: 6, amount: 480, deliveryStatus: 'delivered', rapidoCharge: 30 },
        { id: 'o6', customerId: 'c1', date: '2026-10-14', shift: 'morning', pieces: 100, unitRateApplied: 7, amount: 700, deliveryStatus: 'delivered', rapidoCharge: 40 },
        { id: 'o7', customerId: 'c2', date: '2026-10-14', shift: 'morning', pieces: 150, unitRateApplied: 6, amount: 900, deliveryStatus: 'delivered', rapidoCharge: 50 },
        { id: 'o8', customerId: 'c4', date: '2026-10-14', shift: 'morning', pieces: 120, unitRateApplied: 7, amount: 840, deliveryStatus: 'delivered', rapidoCharge: 0 }
      ],
      payments: [
        { id: 'p1', customerId: 'c1', date: '2026-10-12', amount: 700, mode: 'UPI' },
        { id: 'p2', customerId: 'c2', date: '2026-10-10', amount: 1000, mode: 'Cash' }
      ],
      expenses: [
        { id: 'e1', category: 'Rice Flour', amount: 1200, date: '2026-10-10', customerId: '', note: '50kg Bag' },
        { id: 'e2', category: 'Rapido / Porter', amount: 210, date: '2026-10-12', customerId: 'c2', note: 'Delivery charges for Saravana Bhavan' },
        { id: 'e3', category: 'Shop Rent', amount: 5000, date: '2026-10-01', customerId: '', note: 'Monthly shop rent' }
      ]
    };

    function loadDB() {
      try {
        var str = localStorage.getItem(STORAGE_KEY);
        return str ? JSON.parse(str) : initialData;
      } catch(e) {
        return initialData;
      }
    }

    function saveDB(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (dbCloud) {
        dbCloud.collection('app_data').doc('main_store').set(data).catch(function(err){});
      }
    }

    var appState = {
      db: loadDB(),
      tab: 'dashboard',
      orderDate: '2026-10-14',
      orderShift: 'morning',
      dashShop: 'all',
      dashDateMode: 'all',
      dashStartDate: '2026-10-01',
      dashEndDate: '2026-10-14',
      billShop: 'c1',
      showModal: false,
      editingShopId: null,
      showExpenseModal: false,
      expenseFilterCategory: 'all'
    };

    if (dbCloud) {
      dbCloud.collection('app_data').doc('main_store').onSnapshot(function(doc) {
        if (doc.exists) {
          appState.db = doc.data();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.db));
          render();
        }
      });
    }

    function formatMoney(num) {
      if (appState.db.settings.hideConfidential) return '••••••';
      return '₹' + Number(num || 0).toLocaleString('en-IN');
    }

    function render() {
      var container = document.getElementById('app');
      container.className = appState.db.settings.hideConfidential ? 'hide-numbers' : '';

      var html = '';

      // Header
      html += '<header class="glass rounded-2xl p-4 mb-6 flex justify-between items-center flex-wrap gap-4">';
      html += '  <div class="flex items-center gap-3">';
      html += '    <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xl border border-emerald-500/30">SS</div>';
      html += '    <div><h1 class="text-xl font-bold text-white">' + appState.db.settings.businessName + '</h1><p class="text-xs text-gray-400">Idiyappam Supply & Revenue Hub</p></div>';
      html += '  </div>';
      html += '  <div class="flex gap-2">';
      html += '    <button onclick="togglePrivacy()" class="px-3 py-1.5 rounded-lg bg-gray-800 text-xs text-gray-300 border border-gray-700">' + (appState.db.settings.hideConfidential ? '🙈 Numbers Hidden' : '👁️ Numbers Visible') + '</button>';
      html += '  </div>';
      html += '</header>';

      // Nav Tabs
      var tabs = ['dashboard', 'orders', 'checklist', 'collections', 'expenses', 'bills', 'shops', 'backup'];
      html += '<nav class="flex overflow-x-auto gap-2 pb-2 mb-6 scrollbar-none">';
      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        var active = appState.tab === t;
        html += '<button onclick="switchTab(\'' + t + '\')" class="px-4 py-2.5 rounded-xl font-semibold text-xs whitespace-nowrap transition-all ' + (active ? 'bg-emerald-500 text-white shadow-lg' : 'bg-gray-800/60 text-gray-400') + '">' + t.toUpperCase() + '</button>';
      }
      html += '</nav>';

      // Page Contents
      html += '<main>';
      if (appState.tab === 'dashboard') html += renderDashboard();
      if (appState.tab === 'orders') html += renderOrders();
      if (appState.tab === 'checklist') html += renderChecklist();
      if (appState.tab === 'collections') html += renderCollections();
      if (appState.tab === 'expenses') html += renderExpenses();
      if (appState.tab === 'bills') html += renderBills();
      if (appState.tab === 'shops') html += renderShops();
      if (appState.tab === 'backup') html += renderBackup();
      html += '</main>';

      container.innerHTML = html;
      
      if (appState.tab === 'orders') {
        recalculateOrderTotals();
      }
    }

    function renderDashboard() {
      var orders = appState.db.orders.filter(function(o){ return o.deliveryStatus === 'delivered'; });

      // Apply Shop Filter
      if (appState.dashShop !== 'all') {
        orders = orders.filter(function(o){ return o.customerId === appState.dashShop; });
      }

      // Apply Date Filter
      var todayStr = '2026-10-14';
      if (appState.dashDateMode === 'today') {
        orders = orders.filter(function(o){ return o.date === todayStr; });
      } else if (appState.dashDateMode === 'thisWeek') {
        orders = orders.filter(function(o){ return o.date >= '2026-10-12' && o.date <= '2026-10-18'; });
      } else if (appState.dashDateMode === 'thisMonth') {
        orders = orders.filter(function(o){ return o.date >= '2026-10-01' && o.date <= '2026-10-31'; });
      } else if (appState.dashDateMode === 'custom' && appState.dashStartDate && appState.dashEndDate) {
        orders = orders.filter(function(o){ return o.date >= appState.dashStartDate && o.date <= appState.dashEndDate; });
      }

      var rev = orders.reduce(function(s, o){ return s + o.amount; }, 0);
      var pcs = orders.reduce(function(s, o){ return s + o.pieces; }, 0);
      var paid = appState.db.payments.reduce(function(s, p){ return s + p.amount; }, 0);
      var totalDelivered = appState.db.orders.filter(function(o){ return o.deliveryStatus === 'delivered'; }).reduce(function(s, o){ return s + o.amount; }, 0);
      var dues = totalDelivered - paid;

      // Group by Shop for Pie Chart
      var shopRevenueMap = {};
      var colors = ['#10b981', '#06b6d4', '#f59e0b', '#ec4899', '#8b5cf6', '#6366f1'];
      for (var i = 0; i < orders.length; i++) {
        var ord = orders[i];
        shopRevenueMap[ord.customerId] = (shopRevenueMap[ord.customerId] || 0) + ord.amount;
      }

      // Group by Date for Trend Bar Chart
      var dateMap = {};
      for (var d = 0; d < orders.length; d++) {
        var oDate = orders[d].date;
        dateMap[oDate] = (dateMap[oDate] || 0) + orders[d].amount;
      }
      var sortedDates = Object.keys(dateMap).sort();
      var maxDailyRev = Math.max.apply(Math, Object.values(dateMap).concat([1000]));

      var h = '';

      // 1. FILTER CONTROLS BAR
      h += '<div class="glass p-4 rounded-2xl mb-6 space-y-4">';
      h += '  <div class="flex flex-wrap items-center justify-between gap-4">';
      
      // Shop Dropdown
      h += '    <div class="flex items-center gap-2">';
      h += '      <label class="text-xs text-gray-400 font-bold">Filter Shop:</label>';
      h += '      <select onchange="setDashShop(this.value)" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-2 font-semibold">';
      h += '        <option value="all">All Shops</option>';
      for (var j = 0; j < appState.db.customers.length; j++) {
        var c = appState.db.customers[j];
        h += '        <option value="' + c.id + '" ' + (appState.dashShop === c.id ? 'selected' : '') + '>' + c.name + '</option>';
      }
      h += '      </select>';
      h += '    </div>';

      // Date Range Dropdown
      h += '    <div class="flex items-center gap-2 flex-wrap">';
      h += '      <label class="text-xs text-gray-400 font-bold">Date Range:</label>';
      h += '      <select onchange="setDashDateMode(this.value)" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-2 font-semibold">';
      h += '        <option value="all" ' + (appState.dashDateMode === 'all' ? 'selected' : '') + '>All Time</option>';
      h += '        <option value="today" ' + (appState.dashDateMode === 'today' ? 'selected' : '') + '>Today</option>';
      h += '        <option value="thisWeek" ' + (appState.dashDateMode === 'thisWeek' ? 'selected' : '') + '>This Week</option>';
      h += '        <option value="thisMonth" ' + (appState.dashDateMode === 'thisMonth' ? 'selected' : '') + '>This Month</option>';
      h += '        <option value="custom" ' + (appState.dashDateMode === 'custom' ? 'selected' : '') + '>Custom Range</option>';
      h += '      </select>';
      h += '    </div>';

      h += '  </div>';

      if (appState.dashDateMode === 'custom') {
        h += '  <div class="flex items-center gap-3 pt-2 border-t border-gray-800">';
        h += '    <span class="text-xs text-gray-400 font-semibold">From:</span>';
        h += '    <input type="date" value="' + appState.dashStartDate + '" onchange="setDashStartDate(this.value)" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-1.5 font-semibold">';
        h += '    <span class="text-xs text-gray-400 font-semibold">To:</span>';
        h += '    <input type="date" value="' + appState.dashEndDate + '" onchange="setDashEndDate(this.value)" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-1.5 font-semibold">';
        h += '  </div>';
      }

      h += '</div>';

      // 2. KPI CARDS
      h += '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-emerald-500"><p class="text-xs text-gray-400 font-bold">PIECES SUPPLIED</p><p class="text-2xl font-bold text-white mt-1 secret-number">' + pcs.toLocaleString('en-IN') + '</p></div>';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-teal-500"><p class="text-xs text-gray-400 font-bold">FILTERED REVENUE</p><p class="text-2xl font-bold text-emerald-400 mt-1 secret-number">' + formatMoney(rev) + '</p></div>';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-rose-500"><p class="text-xs text-gray-400 font-bold">TOTAL DUES OWED</p><p class="text-2xl font-bold text-rose-400 mt-1 secret-number">' + formatMoney(dues) + '</p></div>';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-sky-500"><p class="text-xs text-gray-400 font-bold">COLLECTED CASH</p><p class="text-2xl font-bold text-sky-400 mt-1 secret-number">' + formatMoney(paid) + '</p></div>';
      h += '</div>';

      // 3. PIE CHART SECTION
      h += '<div class="glass p-5 rounded-2xl mb-6">';
      h += '  <h2 class="text-md font-bold text-white mb-4">Shop Revenue Share (Pie Breakdown)</h2>';
      
      var shopKeys = Object.keys(shopRevenueMap);
      if (shopKeys.length === 0) {
        h += '  <p class="text-xs text-gray-500 text-center py-6">No sales data found for the selected filters.</p>';
      } else {
        var svgArcs = '';
        var cumulativeAngle = 0;
        var colorIdx = 0;

        for (var k = 0; k < shopKeys.length; k++) {
          var cid = shopKeys[k];
          var val = shopRevenueMap[cid];
          var percentage = rev > 0 ? (val / rev) : 0;
          var angle = percentage * 360;

          var x1 = 50 + 40 * Math.cos(Math.PI * (cumulativeAngle - 90) / 180);
          var y1 = 50 + 40 * Math.sin(Math.PI * (cumulativeAngle - 90) / 180);

          cumulativeAngle += angle;

          var x2 = 50 + 40 * Math.cos(Math.PI * (cumulativeAngle - 90) / 180);
          var y2 = 50 + 40 * Math.sin(Math.PI * (cumulativeAngle - 90) / 180);

          var largeArcFlag = angle > 180 ? 1 : 0;
          var color = colors[colorIdx % colors.length];
          colorIdx++;

          if (shopKeys.length === 1) {
            svgArcs += '<circle cx="50" cy="50" r="40" fill="' + color + '" />';
          } else {
            svgArcs += '<path d="M 50 50 L ' + x1 + ' ' + y1 + ' A 40 40 0 ' + largeArcFlag + ' 1 ' + x2 + ' ' + y2 + ' Z" fill="' + color + '" />';
          }
        }

        h += '  <div class="flex flex-col md:flex-row items-center justify-around gap-6">';
        h += '    <div class="w-44 h-44 relative flex items-center justify-center shrink-0">';
        h += '      <svg viewBox="0 0 100 100" class="w-full h-full transform -rotate-90 rounded-full overflow-hidden">' + svgArcs + '</svg>';
        h += '    </div>';

        h += '    <div class="space-y-2.5 w-full flex-1 max-w-md">';
        colorIdx = 0;
        for (var l = 0; l < shopKeys.length; l++) {
          var custId = shopKeys[l];
          var custObj = appState.db.customers.find(function(c){ return c.id === custId; }) || { name: 'Unknown' };
          var shopVal = shopRevenueMap[custId];
          var pctVal = Math.round((shopVal / rev) * 100);
          var clr = colors[colorIdx % colors.length];
          colorIdx++;

          h += '      <div class="flex justify-between items-center glass-card p-2.5 rounded-xl text-xs">';
          h += '        <div class="flex items-center gap-2">';
          h += '          <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ' + clr + '"></span>';
          h += '          <span class="text-white font-semibold">' + custObj.name + '</span>';
          h += '        </div>';
          h += '        <span class="text-emerald-400 font-bold secret-number">' + formatMoney(shopVal) + ' (' + pctVal + '%)</span>';
          h += '      </div>';
        }
        h += '    </div>';
        h += '  </div>';
      }

      h += '</div>';

      // 4. DAILY REVENUE TREND MONITOR (BAR CHART)
      h += '<div class="glass p-5 rounded-2xl">';
      h += '  <div class="flex justify-between items-center mb-4">';
      h += '    <h2 class="text-md font-bold text-white">Revenue Monitor (Daily Sales)</h2>';
      h += '    <span class="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded font-bold">Delivered Orders</span>';
      h += '  </div>';

      if (sortedDates.length === 0) {
        h += '  <p class="text-xs text-gray-500 text-center py-6">No delivered orders for the selected range.</p>';
      } else {
        h += '  <div class="h-44 w-full flex items-end gap-3 pt-6 pb-2 border-b border-gray-800 overflow-x-auto">';
        for (var dt = 0; dt < sortedDates.length; dt++) {
          var dateKey = sortedDates[dt];
          var dayRevenue = dateMap[dateKey];
          var barHeightPct = Math.max(Math.round((dayRevenue / maxDailyRev) * 100), 12);

          h += '    <div class="flex-1 min-w-[48px] flex flex-col items-center gap-1.5 group">';
          h += '      <span class="text-[10px] text-emerald-400 font-bold secret-number opacity-80 group-hover:opacity-100 transition-opacity">₹' + dayRevenue + '</span>';
          h += '      <div class="w-full bg-emerald-500/80 hover:bg-emerald-400 rounded-t-lg transition-all" style="height: ' + barHeightPct + '%"></div>';
          h += '      <span class="text-[10px] text-gray-400 font-semibold">' + dateKey.slice(5) + '</span>';
          h += '    </div>';
        }
        h += '  </div>';
      }

      h += '</div>';

      return h;
    }

    function setDashShop(val) { appState.dashShop = val; render(); }
    function setDashDateMode(val) { appState.dashDateMode = val; render(); }
    function setDashStartDate(val) { appState.dashStartDate = val; render(); }
    function setDashEndDate(val) { appState.dashEndDate = val; render(); }

    function renderOrders() {
      var d = new Date(appState.orderDate);
      var isTuesday = d.getDay() === 2;
      if (isTuesday && appState.orderShift === 'evening') {
        appState.orderShift = 'morning';
      }

      var h = '<div class="glass p-5 rounded-2xl space-y-6">';
      h += '  <div>';
      h += '    <h2 class="text-lg font-bold text-white mb-1">Quick Shift Order Entry</h2>';
      h += '    <p class="text-xs text-gray-400">Enter pieces supplied and Rapido/Porter charges paid by you.</p>';
      h += '  </div>';

      h += '  <div class="glass-card p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">';
      h += '    <div class="flex items-center gap-2">';
      h += '      <label class="text-xs text-gray-400 font-bold">Order Date:</label>';
      h += '      <input type="date" value="' + appState.orderDate + '" onchange="setOrderDate(this.value)" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-2 font-semibold">';
      h += '    </div>';

      h += '    <div class="flex items-center gap-2">';
      h += '      <span class="text-xs text-gray-400 font-bold mr-1">Shift:</span>';
      
      var isMorn = appState.orderShift === 'morning';
      h += '      <button onclick="setOrderShift(\'morning\')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all ' + (isMorn ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20' : 'bg-gray-800 text-gray-400') + '">☀️ MORNING</button>';

      var isEve = appState.orderShift === 'evening';
      if (isTuesday) {
        h += '      <button disabled class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-800/40 text-gray-600 cursor-not-allowed">🌙 EVENING (TUESDAY OFF)</button>';
      } else {
        h += '      <button onclick="setOrderShift(\'evening\')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all ' + (isEve ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/20' : 'bg-gray-800 text-gray-400') + '">🌙 EVENING</button>';
      }

      h += '    </div>';
      h += '  </div>';

      h += '  <div class="space-y-4">';
      for (var i = 0; i < appState.db.customers.length; i++) {
        var c = appState.db.customers[i];
        if (!c.isActive) continue;

        var defaultQty = appState.orderShift === 'morning' ? c.defaultMorningQty : c.defaultEveningQty;

        h += '    <div class="glass-card p-4 rounded-xl flex flex-wrap md:flex-nowrap justify-between items-center gap-4">';
        h += '      <div>';
        h += '        <p class="font-bold text-white text-base">' + c.name + '</p>';
        h += '        <p class="text-xs text-emerald-400 font-medium">Rate: ₹' + c.unitRate + '/piece</p>';
        h += '      </div>';

        h += '      <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">';
        h += '        <div>';

    function recalculateOrderTotals() {
      var qtyInputs = document.querySelectorAll('.qty-input');
      var rapidoInputs = document.querySelectorAll('.rapido-input');

      var totalPcs = 0;
      var totalVal = 0;
      var totalRapido = 0;

      qtyInputs.forEach(function(input) {
        var pcs = Number(input.value) || 0;
        var rate = Number(input.getAttribute('data-rate')) || 7;
        totalPcs += pcs;
        totalVal += (pcs * rate);
      });

      rapidoInputs.forEach(function(input) {
        totalRapido += (Number(input.value) || 0);
      });

      var pcsElem = document.getElementById('totalPcsSummary');
      var valElem = document.getElementById('totalValSummary');
      var rapElem = document.getElementById('totalRapidoSummary');

      if (pcsElem) pcsElem.innerText = totalPcs.toLocaleString('en-IN') + ' Pcs';
      if (valElem) valElem.innerText = formatMoney(totalVal);
      if (rapElem) rapElem.innerText = formatMoney(totalRapido);
    }

    function toggleDeliveryStatus(orderId, customerId, markDelivered) {
      var ord = appState.db.orders.find(function(o){ return o.id === orderId; });

      } else {
        var cust = appState.db.customers.find(function(c){ return c.id === customerId; });
        var pcs = cust ? (appState.orderShift === 'morning' ? cust.defaultMorningQty : cust.defaultEveningQty) : 100;
        var rate = cust ? cust.unitRate : 7;

        appState.db.orders.push({
          id: 'o_' + Date.now() + '_' + customerId,
          customerId: customerId,
          date: appState.orderDate,
          shift: appState.orderShift,
          pieces: pcs,
          unitRateApplied: rate,
          amount: pcs * rate,
          deliveryStatus: markDelivered ? 'delivered' : 'pending',
          rapidoCharge: 0
        });
      }

      saveDB(appState.db);
      render();
    }

      var category = document.getElementById('expCategory').value;
      var amount = Number(document.getElementById('expAmount').value) || 0;
      var date = document.getElementById('expDate').value || appState.orderDate;
      var shopId = document.getElementById('expShop').value;
      var note = document.getElementById('expNote').value;

      if (amount <= 0) return alert("Please enter a valid expense amount.");

      appState.db.expenses.push({
        id: 'e_' + Date.now(),
        category: category,
        amount: amount,
        date: date,
        customerId: shopId,
        note: note
      });

      saveDB(appState.db);
      toggleExpenseModal(false);
    }

        h += '        <button onclick="toggleShopStatus(\'' + c.id + '\')" class="px-2.5 py-1 text-xs rounded-lg font-semibold bg-gray-800 text-gray-300 hover:text-white">' + (c.isActive ? 'Deactivate' : 'Activate') + '</button>';
        h += '        <button onclick="openEditShopModal(\'' + c.id + '\')" class="px-3 py-1 text-xs rounded-lg font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-500 hover:text-white transition-all">✏️ Edit</button>';
        h += '        <button onclick="deleteShop(\'' + c.id + '\')" class="px-2 py-1 text-xs rounded-lg font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30 hover:bg-rose-500 hover:text-white transition-all" title="Delete Shop">🗑️</button>';
        h += '      </div>';

        h += '    </div>';
      }
      h += '  </div>';
      h += '</div>';

      if (appState.showModal) {
        var editingCust = appState.editingShopId ? appState.db.customers.find(function(c){ return c.id === appState.editingShopId; }) : null;

        h += '<div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">';
        h += '  <div class="glass p-6 rounded-2xl w-full max-w-md space-y-4 max-h-[90vh] overflow-y-auto">';
        h += '    <h3 class="text-lg font-bold text-white">' + (editingCust ? 'Edit Shop Details' : 'Add New Shop') + '</h3>';
        
        h += '    <div>';
        h += '      <label class="text-xs text-gray-400 font-bold block mb-1">Shop / Hotel Name</label>';
        h += '      <input id="shopName" type="text" value="' + (editingCust ? editingCust.name : '') + '" placeholder="e.g. Hotel Annapoorna" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm font-semibold">';
        h += '    </div>';

        h += '    <div>';
        h += '      <label class="text-xs text-gray-400 font-bold block mb-1">WhatsApp Phone Number (for Bills)</label>';
        h += '      <input id="shopPhone" type="text" value="' + (editingCust ? editingCust.ownerPhone : '') + '" placeholder="e.g. 9842100000" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm font-semibold">';
        h += '    </div>';

        h += '    <div>';
        h += '      <label class="text-xs text-gray-400 font-bold block mb-1">Location / Address</label>';
        h += '      <input id="shopAddress" type="text" value="' + (editingCust && editingCust.address ? editingCust.address : '') + '" placeholder="e.g. Main Road, Bus Stand Junction" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
        h += '    </div>';

        h += '    <div class="grid grid-cols-2 gap-3">';
        h += '      <div>';
        h += '        <label class="text-xs text-gray-400 font-bold block mb-1">Unit Rate (₹)</label>';
        h += '        <input id="shopRate" type="number" value="' + (editingCust ? editingCust.unitRate : 7) + '" placeholder="7" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm font-bold">';
        h += '      </div>';
        h += '      <div>';
        h += '        <label class="text-xs text-gray-400 font-bold block mb-1">Business Type</label>';
        h += '        <select id="shopType" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
        var typeVal = editingCust ? editingCust.type : 'hotel';
        h += '          <option value="hotel" ' + (typeVal === 'hotel' ? 'selected' : '') + '>Hotel</option>';
        h += '          <option value="restaurant" ' + (typeVal === 'restaurant' ? 'selected' : '') + '>Restaurant</option>';
        h += '          <option value="catering" ' + (typeVal === 'catering' ? 'selected' : '') + '>Catering</option>';
        h += '          <option value="individual" ' + (typeVal === 'individual' ? 'selected' : '') + '>Individual</option>';
        h += '        </select>';
        h += '      </div>';
        h += '    </div>';

        h += '    <div class="grid grid-cols-2 gap-3">';
        h += '      <div>';
        h += '        <label class="text-xs text-gray-400 font-bold block mb-1">Default Morning Pcs</label>';
        h += '        <input id="shopMornQty" type="number" value="' + (editingCust ? editingCust.defaultMorningQty : 100) + '" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
        h += '      </div>';
        h += '      <div>';
        h += '        <label class="text-xs text-gray-400 font-bold block mb-1">Default Evening Pcs</label>';
        h += '        <input id="shopEveQty" type="number" value="' + (editingCust ? editingCust.defaultEveningQty : 50) + '" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
        h += '      </div>';
        h += '    </div>';

        h += '    <div class="flex justify-end gap-2 pt-3 border-t border-gray-800">';
        h += '      <button onclick="closeShopModal()" class="px-4 py-2 bg-gray-800 text-xs rounded-xl text-gray-300">Cancel</button>';
        h += '      <button onclick="saveShopRecord()" class="px-4 py-2 bg-emerald-500 text-xs rounded-xl text-white font-bold">' + (editingCust ? 'Update Shop' : 'Save Shop') + '</button>';
        h += '    </div>';
        h += '  </div>';
        h += '</div>';
      }

      return h;
    }

    function openAddShopModal() { appState.editingShopId = null; appState.showModal = true; render(); }
    function openEditShopModal(id) { appState.editingShopId = id; appState.showModal = true; render(); }
    function closeShopModal() { appState.showModal = false; appState.editingShopId = null; render(); }

    function saveShopRecord() {
      var name = document.getElementById('shopName').value;
      var phone = document.getElementById('shopPhone').value;
      var address = document.getElementById('shopAddress').value;
      var rate = Number(document.getElementById('shopRate').value) || 7;
      var type = document.getElementById('shopType').value;
      var mornQty = Number(document.getElementById('shopMornQty').value) || 100;
      var eveQty = Number(document.getElementById('shopEveQty').value) || 50;

      if (!name) return alert("Please enter shop name.");

      if (appState.editingShopId) {
        var cust = appState.db.customers.find(function(c){ return c.id === appState.editingShopId; });
        if (cust) {
          cust.name = name;
          cust.ownerPhone = phone || '9842100000';
          cust.address = address;
          cust.unitRate = rate;
          cust.type = type;
          cust.defaultMorningQty = mornQty;
          cust.defaultEveningQty = eveQty;
        }
      } else {
        appState.db.customers.push({
          id: 'c' + Date.now(),
          name: name,
          type: type,
          ownerPhone: phone || '9842100000',
          address: address,
          unitRate: rate,
          defaultMorningQty: mornQty,
          defaultEveningQty: eveQty,
          isActive: true
        });
      }

      saveDB(appState.db);
      closeShopModal();
    }

    function toggleShopStatus(id) {
      var cust = appState.db.customers.find(function(c){ return c.id === id; });
      if (cust) {
        cust.isActive = !cust.isActive;
        saveDB(appState.db);
        render();
      }
    }

    function deleteShop(id) {
      var cust = appState.db.customers.find(function(c){ return c.id === id; });
      if (cust && confirm("Are you sure you want to delete '" + cust.name + "'? Orders and bill history for this shop will be preserved.")) {
        appState.db.customers = appState.db.customers.filter(function(c){ return c.id !== id; });
        saveDB(appState.db);
        render();
      }
    }

    function renderBackup() {
      var h = '<div class="glass p-5 rounded-2xl space-y-6">';
      h += '  <div><h2 class="text-lg font-bold text-white">Backup & Restore</h2><p class="text-xs text-gray-400">Export or restore your business records.</p></div>';
      h += '  <div class="glass-card p-4 rounded-xl space-y-2">';
      h += '    <h3 class="font-bold text-white text-sm">Download JSON Backup</h3>';
      h += '    <button onclick="exportData()" class="px-4 py-2 bg-emerald-500 font-bold text-white text-xs rounded-xl">📥 Export Backup (.json)</button>';
      h += '  </div>';
      h += '</div>';
      return h;
    }

    // Handlers
    function switchTab(t) { appState.tab = t; render(); }
    function togglePrivacy() { appState.db.settings.hideConfidential = !appState.db.settings.hideConfidential; saveDB(appState.db); render(); }
    function setOrderDate(val) { appState.orderDate = val; render(); }
    function setOrderShift(val) { appState.orderShift = val; render(); }
    function setBillShop(val) { appState.billShop = val; render(); }

    function saveOrdersBatch() {
      for (var i = 0; i < appState.db.customers.length; i++) {
        var c = appState.db.customers[i];
        if (!c.isActive) continue;

        var qtyInput = document.getElementById('qty_' + c.id);
        var rapidoInput = document.getElementById('rapido_' + c.id);

        var pcs = qtyInput ? (Number(qtyInput.value) || 0) : 0;
        var rapido = rapidoInput ? (Number(rapidoInput.value) || 0) : 0;

        if (pcs > 0) {
          appState.db.orders.push({
            id: 'o_' + Date.now() + '_' + c.id,
            customerId: c.id,
            date: appState.orderDate,
            shift: appState.orderShift,
            pieces: pcs,
            unitRateApplied: c.unitRate,
            amount: pcs * c.unitRate,
            deliveryStatus: 'delivered',
            rapidoCharge: rapido
          });

          if (rapido > 0) {
            appState.db.expenses.push({
              id: 'e_' + Date.now() + '_' + c.id,
              category: 'Rapido / Porter',
              amount: rapido,
              date: appState.orderDate,
              customerId: c.id,
              note: 'Delivery fee for ' + c.name + ' (' + appState.orderShift + ')'
            });
          }
        }
      }

      saveDB(appState.db);
      alert("Shift orders and delivery expenses saved successfully!");
      render();
    }

    function shareWhatsApp(name, phone, pcs, amt) {
      var msg = "*IDIYAPPAM BILL - " + appState.db.settings.businessName + "*\n\nShop: " + name + "\nTotal Pieces: " + pcs + "\n*Total Amount Due: ₹" + amt + "*\n\nThank you!";
      window.open("https://wa.me/91" + phone + "?text=" + encodeURIComponent(msg), '_blank');
    }

    function exportData() {
      var str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState.db, null, 2));
      var a = document.createElement('a');
      a.setAttribute("href", str);
      a.setAttribute("download", "srisai-backup.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    render();
  </script>
</body>
</html>
