<!DOCTYPE html>
<html lang="ta" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Sai Home Foods - Idiyappam Management Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', 'Noto Sans Tamil', sans-serif; }
    .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .hide-numbers .secret-number { filter: blur(6px); user-select: none; }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="max-w-7xl mx-auto px-4 py-4"></div>

  <script>
    // 1. Firebase Credentials
    var firebaseConfig = {
      apiKey: "AIzaSyBE04f1-vwEbhkCxX-o_xU62aXTTok-AB4",
      authDomain: "sri-sai-home-foods-30fdb.firebaseapp.com",
      projectId: "sri-sai-home-foods-30fdb",
      storageBucket: "sri-sai-home-foods-30fdb.firebasestorage.app",
      messagingSenderId: "626791846753",
      appId: "1:626791846753:web:524fa5121115ef122f2b20"
    };

    var dbCloud = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        dbCloud = firebase.firestore();
      }
    } catch(e) {
      console.log("Firebase fallback mode.");
    }

    var STORAGE_KEY = 'srisai_production_v1';

    var initialData = {
      settings: {
        businessName: "Sri Sai Home Foods",
        ownerPhone: "9842100000",
        upiId: "srisaihomefoods@upi",
        hideConfidential: true,
        language: "en"
      },
      customers: [
        { id: 'c1', name: 'Hotel Annapoorna', type: 'hotel', ownerPhone: '9842100001', unitRate: 7, defaultMorningQty: 100, defaultEveningQty: 80, isActive: true },
        { id: 'c2', name: 'Hotel Saravana Bhavan', type: 'hotel', ownerPhone: '9842100002', unitRate: 6, defaultMorningQty: 150, defaultEveningQty: 120, isActive: true },
        { id: 'c3', name: 'Sangeetha Restaurant', type: 'restaurant', ownerPhone: '9842100003', unitRate: 6, defaultMorningQty: 80, defaultEveningQty: 60, isActive: true },
        { id: 'c4', name: 'Sri Ram Caterers', type: 'catering', ownerPhone: '9842100004', unitRate: 7, defaultMorningQty: 200, defaultEveningQty: 0, isActive: true }
      ],
      orders: [
        { id: 'o1', customerId: 'c1', date: '2026-10-12', shift: 'morning', pieces: 100, unitRateApplied: 7, amount: 700, deliveryStatus: 'delivered', rapidoCharge: 40 },
        { id: 'o2', customerId: 'c2', date: '2026-10-12', shift: 'morning', pieces: 150, unitRateApplied: 6, amount: 900, deliveryStatus: 'delivered', rapidoCharge: 50 },
        { id: 'o3', customerId: 'c1', date: '2026-10-13', shift: 'morning', pieces: 100, unitRateApplied: 7, amount: 700, deliveryStatus: 'delivered', rapidoCharge: 40 },
        { id: 'o4', customerId: 'c2', date: '2026-10-13', shift: 'morning', pieces: 150, unitRateApplied: 6, amount: 900, deliveryStatus: 'delivered', rapidoCharge: 50 },
        { id: 'o5', customerId: 'c3', date: '2026-10-13', shift: 'morning', pieces: 80, unitRateApplied: 6, amount: 480, deliveryStatus: 'delivered', rapidoCharge: 30 }
      ],
      payments: [
        { id: 'p1', customerId: 'c1', date: '2026-10-12', amount: 700, mode: 'UPI' },
        { id: 'p2', customerId: 'c2', date: '2026-10-10', amount: 1000, mode: 'Cash' }
      ],
      expenses: [
        { id: 'e1', category: 'Rice Flour', amount: 1200, date: '2026-10-10', note: '50kg Bag' },
        { id: 'e2', category: 'Rapido / Porter', amount: 210, date: '2026-10-12', note: 'Delivery charges' }
      ]
    };

    function loadDB() {
      try {
        var str = localStorage.getItem(STORAGE_KEY);
        return str ? JSON.parse(str) : initialData;
      } catch(e) {
        return initialData;
      }
    }

    function saveDB(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (dbCloud) {
        dbCloud.collection('app_data').doc('main_store').set(data).catch(function(err){});
      }
    }

    var appState = {
      db: loadDB(),
      tab: 'dashboard',
      dashShop: 'all',
      billShop: 'c1',
      showModal: false,
      restorePreview: null
    };

    if (dbCloud) {
      dbCloud.collection('app_data').doc('main_store').onSnapshot(function(doc) {
        if (doc.exists) {
          appState.db = doc.data();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.db));
          render();
        }
      });
    }

    function formatMoney(num) {
      if (appState.db.settings.hideConfidential) return '••••••';
      return '₹' + Number(num || 0).toLocaleString('en-IN');
    }

    function render() {
      var container = document.getElementById('app');
      container.className = appState.db.settings.hideConfidential ? 'hide-numbers' : '';

      var html = '';

      // Header
      html += '<header class="glass rounded-2xl p-4 mb-6 flex justify-between items-center flex-wrap gap-4">';
      html += '  <div class="flex items-center gap-3">';
      html += '    <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xl border border-emerald-500/30">SS</div>';
      html += '    <div><h1 class="text-xl font-bold text-white">' + appState.db.settings.businessName + '</h1><p class="text-xs text-gray-400">Idiyappam Supply & Revenue Hub</p></div>';
      html += '  </div>';
      html += '  <div class="flex gap-2">';
      html += '    <button onclick="togglePrivacy()" class="px-3 py-1.5 rounded-lg bg-gray-800 text-xs text-gray-300 border border-gray-700">' + (appState.db.settings.hideConfidential ? '🙈 Numbers Hidden' : '👁️ Numbers Visible') + '</button>';
      html += '  </div>';
      html += '</header>';

      // Nav Tabs
      var tabs = ['dashboard', 'orders', 'checklist', 'collections', 'expenses', 'bills', 'shops', 'backup'];
      html += '<nav class="flex overflow-x-auto gap-2 pb-2 mb-6 scrollbar-none">';
      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        var active = appState.tab === t;
        html += '<button onclick="switchTab(\'' + t + '\')" class="px-4 py-2.5 rounded-xl font-semibold text-xs whitespace-nowrap transition-all ' + (active ? 'bg-emerald-500 text-white shadow-lg' : 'bg-gray-800/60 text-gray-400') + '">' + t.toUpperCase() + '</button>';
      }
      html += '</nav>';

      // Page Contents
      html += '<main>';
      if (appState.tab === 'dashboard') html += renderDashboard();
      if (appState.tab === 'orders') html += renderOrders();
      if (appState.tab === 'checklist') html += renderChecklist();
      if (appState.tab === 'collections') html += renderCollections();
      if (appState.tab === 'expenses') html += renderExpenses();
      if (appState.tab === 'bills') html += renderBills();
      if (appState.tab === 'shops') html += renderShops();
      if (appState.tab === 'backup') html += renderBackup();
      html += '</main>';

      container.innerHTML = html;
    }

    function renderDashboard() {
      var orders = appState.db.orders.filter(function(o){ return o.deliveryStatus === 'delivered'; });
      if (appState.dashShop !== 'all') {
        orders = orders.filter(function(o){ return o.customerId === appState.dashShop; });
      }

      var rev = orders.reduce(function(s, o){ return s + o.amount; }, 0);
      var pcs = orders.reduce(function(s, o){ return s + o.pieces; }, 0);
      var paid = appState.db.payments.reduce(function(s, p){ return s + p.amount; }, 0);
      var totalDelivered = appState.db.orders.filter(function(o){ return o.deliveryStatus === 'delivered'; }).reduce(function(s, o){ return s + o.amount; }, 0);
      var dues = totalDelivered - paid;

      var h = '';
      h += '<div class="glass p-4 rounded-2xl mb-6 flex items-center justify-between">';
      h += '  <span class="text-xs text-gray-400 font-bold">Filter Shop:</span>';
      h += '  <select onchange="setDashShop(this.value)" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-2">';
      h += '    <option value="all">All Shops</option>';
      for (var i = 0; i < appState.db.customers.length; i++) {
        var c = appState.db.customers[i];
        h += '    <option value="' + c.id + '" ' + (appState.dashShop === c.id ? 'selected' : '') + '>' + c.name + '</option>';
      }
      h += '  </select>';
      h += '</div>';

      h += '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-emerald-500"><p class="text-xs text-gray-400">PIECES SUPPLIED</p><p class="text-2xl font-bold text-white mt-1 secret-number">' + pcs + '</p></div>';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-teal-500"><p class="text-xs text-gray-400">TOTAL REVENUE</p><p class="text-2xl font-bold text-emerald-400 mt-1 secret-number">' + formatMoney(rev) + '</p></div>';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-rose-500"><p class="text-xs text-gray-400">TOTAL DUES OWED</p><p class="text-2xl font-bold text-rose-400 mt-1 secret-number">' + formatMoney(dues) + '</p></div>';
      h += '  <div class="glass-card p-4 rounded-2xl border-l-4 border-sky-500"><p class="text-xs text-gray-400">COLLECTED CASH</p><p class="text-2xl font-bold text-sky-400 mt-1 secret-number">' + formatMoney(paid) + '</p></div>';
      h += '</div>';

      return h;
    }

    function renderOrders() {
      var h = '<div class="glass p-5 rounded-2xl"><h2 class="text-lg font-bold text-white mb-4">Quick Shift Order Entry</h2><div class="space-y-4">';
      for (var i = 0; i < appState.db.customers.length; i++) {
        var c = appState.db.customers[i];
        if (!c.isActive) continue;
        h += '<div class="glass-card p-4 rounded-xl flex justify-between items-center">';
        h += '  <div><p class="font-bold text-white">' + c.name + '</p><p class="text-xs text-emerald-400">Rate: ₹' + c.unitRate + '/pc</p></div>';
        h += '  <div class="flex items-center gap-3">';
        h += '    <input type="number" value="' + c.defaultMorningQty + '" class="w-20 bg-gray-900 border border-gray-700 text-white text-center font-bold px-2 py-1.5 rounded-lg">';
        h += '  </div>';
        h += '</div>';
      }
      h += '<button onclick="alert(\'Shift Orders Saved!\')" class="w-full bg-emerald-500 font-bold text-white py-3 rounded-xl shadow-lg mt-4">SAVE SHIFT ORDERS</button>';
      h += '</div></div>';
      return h;
    }

    function renderChecklist() {
      var h = '<div class="glass p-5 rounded-2xl"><h2 class="text-lg font-bold text-white mb-4">Today\'s Delivery Checklist</h2><div class="space-y-3">';
      for (var i = 0; i < appState.db.customers.length; i++) {
        var c = appState.db.customers[i];
        if (!c.isActive) continue;
        h += '<div class="glass-card p-4 rounded-xl flex justify-between items-center">';
        h += '  <div><p class="font-bold text-white">' + c.name + '</p><p class="text-xs text-gray-400">' + c.defaultMorningQty + ' Pieces • Morning Shift</p></div>';
        h += '  <button onclick="this.innerText=\'✓ DELIVERED\'; this.className=\'px-3 py-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-bold\'" class="px-3 py-1.5 bg-gray-800 text-gray-300 rounded-lg text-xs font-bold">MARK DELIVERED</button>';
        h += '</div>';
      }
      h += '</div></div>';
      return h;
    }

    function renderCollections() {
      var h = '<div class="glass p-5 rounded-2xl"><h2 class="text-lg font-bold text-white mb-4">Customer Collections</h2><div class="space-y-3">';
      for (var i = 0; i < appState.db.customers.length; i++) {
        var c = appState.db.customers[i];
        var billed = appState.db.orders.filter(function(o){ return o.customerId === c.id && o.deliveryStatus === 'delivered'; }).reduce(function(s, o){ return s + o.amount; }, 0);
        var paid = appState.db.payments.filter(function(p){ return p.customerId === c.id; }).reduce(function(s, p){ return s + p.amount; }, 0);
        var bal = billed - paid;
        h += '<div class="glass-card p-4 rounded-xl flex justify-between items-center">';
        h += '  <div><p class="font-bold text-white">' + c.name + '</p><p class="text-xs text-gray-400">Billed: ₹' + billed + ' | Paid: ₹' + paid + '</p></div>';
        h += '  <div class="text-right"><span class="block text-sm font-bold secret-number ' + (bal > 0 ? 'text-rose-400' : 'text-emerald-400') + '">' + (bal > 0 ? 'Owes ' + formatMoney(bal) : 'Settled') + '</span></div>';
        h += '</div>';
      }
      h += '</div></div>';
      return h;
    }

    function renderExpenses() {
      var h = '<div class="glass p-5 rounded-2xl"><h2 class="text-lg font-bold text-white mb-4">Expenses Tracker</h2><div class="space-y-3">';
      for (var i = 0; i < appState.db.expenses.length; i++) {
        var e = appState.db.expenses[i];
        h += '<div class="glass-card p-3 rounded-xl flex justify-between items-center">';
        h += '  <div><p class="font-bold text-white text-sm">' + e.category + '</p><p class="text-xs text-gray-400">' + e.date + ' • ' + (e.note || '') + '</p></div>';
        h += '  <span class="font-bold text-rose-400 text-sm secret-number">₹' + e.amount + '</span>';
        h += '</div>';
      }
      h += '</div></div>';
      return h;
    }

    function renderBills() {
      var selected = appState.db.customers[0];
      for (var i = 0; i < appState.db.customers.length; i++) {
        if (appState.db.customers[i].id === appState.billShop) selected = appState.db.customers[i];
      }

      var orders = appState.db.orders.filter(function(o){ return o.customerId === selected.id && o.deliveryStatus === 'delivered'; });
      var totalAmt = orders.reduce(function(s, o){ return s + o.amount; }, 0);
      var totalPcs = orders.reduce(function(s, o){ return s + o.pieces; }, 0);

      var h = '<div class="grid grid-cols-1 md:grid-cols-3 gap-6">';
      h += '<div class="glass p-5 rounded-2xl space-y-4">';
      h += '  <h2 class="text-lg font-bold text-white">Select Shop</h2>';
      h += '  <select onchange="setBillShop(this.value)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
      for (var j = 0; j < appState.db.customers.length; j++) {
        var c = appState.db.customers[j];
        h += '    <option value="' + c.id + '" ' + (selected.id === c.id ? 'selected' : '') + '>' + c.name + '</option>';
      }
      h += '  </select>';
      h += '  <button onclick="shareWhatsApp(\'' + selected.name + '\', \'' + selected.ownerPhone + '\', ' + totalPcs + ', ' + totalAmt + ')" class="w-full bg-emerald-500 font-bold text-white py-3 rounded-xl shadow-lg mt-4">📲 Share on WhatsApp</button>';
      h += '</div>';

      h += '<div class="md:col-span-2">';
      h += '  <div id="billCard" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">';
      h += '    <div class="border-b border-slate-800 pb-4 mb-4 flex justify-between items-start">';
      h += '      <div><h1 class="text-xl font-extrabold text-emerald-400">IDIYAPPAM BILL</h1><p class="text-xs text-slate-400 font-bold">' + appState.db.settings.businessName + '</p></div>';
      h += '      <div class="text-right"><span class="text-xs font-bold text-slate-300 block">' + selected.name + '</span><span class="text-xs text-slate-500">' + selected.ownerPhone + '</span></div>';
      h += '    </div>';
      h += '    <table class="w-full text-left text-xs mb-6">';
      h += '      <thead><tr class="border-b border-slate-800 text-slate-400"><th class="py-2">Date</th><th class="py-2">Shift</th><th class="py-2 text-center">Pieces</th><th class="py-2 text-right">Amount</th></tr></thead>';
      h += '      <tbody class="divide-y divide-slate-800/60 text-slate-200">';
      for (var k = 0; k < orders.length; k++) {
        var o = orders[k];
        h += '        <tr><td class="py-2">' + o.date + '</td><td class="py-2 capitalize">' + o.shift + '</td><td class="py-2 text-center">' + o.pieces + '</td><td class="py-2 text-right font-bold text-emerald-400">₹' + o.amount + '</td></tr>';
      }
      h += '      </tbody>';
      h += '    </table>';
      h += '    <div class="border-t-2 border-slate-800 pt-4 flex justify-between items-center">';
      h += '      <div><p class="text-xs text-slate-400">Total Pieces</p><p class="text-lg font-bold text-white">' + totalPcs + ' Pcs</p></div>';
      h += '      <div class="text-right"><p class="text-xs text-slate-400">TOTAL DUE</p><p class="text-2xl font-extrabold text-emerald-400 secret-number">' + formatMoney(totalAmt) + '</p></div>';
      h += '    </div>';
      h += '  </div>';
      h += '</div>';
      h += '</div>';

      return h;
    }

    function renderShops() {
      var h = '<div class="glass p-5 rounded-2xl">';
      h += '  <div class="flex justify-between items-center mb-6">';
      h += '    <h2 class="text-lg font-bold text-white">Shops & Customers</h2>';
      h += '    <button onclick="toggleModal(true)" class="px-3 py-2 bg-emerald-500 font-bold text-white text-xs rounded-xl">+ Add New Shop</button>';
      h += '  </div>';
      h += '  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
      for (var i = 0; i < appState.db.customers.length; i++) {
        var c = appState.db.customers[i];
        h += '    <div class="glass-card p-4 rounded-xl flex justify-between items-center">';
        h += '      <div><h3 class="font-bold text-white">' + c.name + '</h3><p class="text-xs text-gray-400">Phone: ' + c.ownerPhone + '</p><p class="text-xs text-emerald-400 mt-1">Rate: ₹' + c.unitRate + '/pc</p></div>';
        h += '      <span class="text-xs font-bold px-2 py-1 rounded bg-emerald-500/20 text-emerald-400">' + (c.isActive ? 'Active' : 'Inactive') + '</span>';
        h += '    </div>';
      }
      h += '  </div>';
      h += '</div>';

      if (appState.showModal) {
        h += '<div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">';
        h += '  <div class="glass p-6 rounded-2xl w-full max-w-md space-y-4">';
        h += '    <h3 class="text-lg font-bold text-white">Add New Shop</h3>';
        h += '    <input id="shopName" type="text" placeholder="Shop Name" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
        h += '    <input id="shopPhone" type="text" placeholder="Phone Number" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
        h += '    <input id="shopRate" type="number" value="7" placeholder="Unit Rate" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-sm">';
        h += '    <div class="flex justify-end gap-2 pt-2">';
        h += '      <button onclick="toggleModal(false)" class="px-4 py-2 bg-gray-800 text-xs rounded-xl text-gray-300">Cancel</button>';
        h += '      <button onclick="saveShop()" class="px-4 py-2 bg-emerald-500 text-xs rounded-xl text-white font-bold">Save Shop</button>';
        h += '    </div>';
        h += '  </div>';
        h += '</div>';
      }

      return h;
    }

    function renderBackup() {
      var h = '<div class="glass p-5 rounded-2xl space-y-6">';
      h += '  <div><h2 class="text-lg font-bold text-white">Backup & Restore</h2><p class="text-xs text-gray-400">Export or restore your business records.</p></div>';
      h += '  <div class="glass-card p-4 rounded-xl space-y-2">';
      h += '    <h3 class="font-bold text-white text-sm">Download JSON Backup</h3>';
      h += '    <button onclick="exportData()" class="px-4 py-2 bg-emerald-500 font-bold text-white text-xs rounded-xl">📥 Export Backup (.json)</button>';
      h += '  </div>';
      h += '</div>';
      return h;
    }

    // Handlers
    function switchTab(t) { appState.tab = t; render(); }
    function togglePrivacy() { appState.db.settings.hideConfidential = !appState.db.settings.hideConfidential; saveDB(appState.db); render(); }
    function setDashShop(val) { appState.dashShop = val; render(); }
    function setBillShop(val) { appState.billShop = val; render(); }
    function toggleModal(show) { appState.showModal = show; render(); }

    function saveShop() {
      var name = document.getElementById('shopName').value;
      var phone = document.getElementById('shopPhone').value;
      var rate = Number(document.getElementById('shopRate').value) || 7;
      if (!name) return alert("Enter shop name");

      appState.db.customers.push({
        id: 'c' + Date.now(),
        name: name,
        ownerPhone: phone || '9842100000',
        unitRate: rate,
        defaultMorningQty: 100,
        defaultEveningQty: 50,
        isActive: true
      });

      saveDB(appState.db);
      toggleModal(false);
    }

    function shareWhatsApp(name, phone, pcs, amt) {
      var msg = "*IDIYAPPAM BILL - " + appState.db.settings.businessName + "*\n\nShop: " + name + "\nTotal Pieces: " + pcs + "\n*Total Amount Due: ₹" + amt + "*\n\nThank you!";
      window.open("https://wa.me/91" + phone + "?text=" + encodeURIComponent(msg), '_blank');
    }

    function exportData() {
      var str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState.db, null, 2));
      var a = document.createElement('a');
      a.setAttribute("href", str);
      a.setAttribute("download", "srisai-backup.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    render();
  </script>
</body>
</html>
